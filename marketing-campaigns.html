<main>
  <!-- The entire Campaigns spread below the navbar is one flattened,
       deterministically-composited production image (Pillow), built
       from the approved master visual with only the three product
       photos swapped in from real, native-resolution campaign assets.
       Nothing here is redrawn in HTML/CSS — the three SVG hotspots
       below are precisely-clipped transparent overlays, nothing more. -->
  <div class="cf-wrap">
    <img
      class="cf-art"
      src="assets/images/campaigns/campaigns-flattened.png"
      width="2880"
      height="1701"
      alt="Campaigns — three campaign boarding-pass tickets: Le Labo × Formula 1, Laneige Flavor Worlds, and Poppi Product Playground."
    />

    <!-- Hotspots as an SVG overlay, viewBox matched 1:1 to the artwork's
         own pixel grid so each <polygon> uses the exact same coordinates
         the compositing script placed each object at. SVG <a>/<polygon>
         is used instead of an HTML <a> with clip-path: a clipped HTML
         element's focus outline gets clipped away too in this engine,
         while an SVG shape's own stroke draws cleanly around the true
         object outline regardless. -->
    <svg class="cf-hotspots" viewBox="0 0 2880 1701" preserveAspectRatio="none" aria-hidden="false">
      <a href="campaigns/le-labo-f1.html">
        <title>View Le Labo × Formula 1 campaign</title>
        <polygon class="cf-hotspot" points="212.5,886.2 913.4,826.2 913.4,1434.6 237.9,1440.0" />
      </a>
      <a href="campaigns/laneige.html">
        <title>View Laneige Flavor Worlds campaign</title>
        <polygon class="cf-hotspot" points="1667.0,365.0 2502.3,296.0 2542.2,802.6 1719.6,868.0" />
      </a>
      <a href="campaigns/poppi.html">
        <title>View Poppi Product Playground campaign</title>
        <polygon class="cf-hotspot" points="1797.7,1011.5 2600.4,946.1 2633.0,1525.3 1752.3,1598.0" />
      </a>
    </svg>
  </div>
</main>
